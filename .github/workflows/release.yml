name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Verify tag matches package version
        run: test "${GITHUB_REF_NAME}" = "v$(uv version --short)"
      - name: Run tests
        run: uv run --locked python tests/fetch_testdata.py && uv run --locked pytest
      - name: Check lint and formatting
        run: uv run --locked ruff check . && uv run --locked ruff format --check .
      - name: Build distributions
        run: uv build
      - name: Verify installed wheel
        run: uv run --isolated --no-project --with dist/*.whl python tests/check_distribution.py
      - name: Verify installed source distribution
        run: uv run --isolated --no-project --with dist/*.tar.gz python tests/check_distribution.py

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Build wheel
        run: uv build --wheel
      - uses: actions/upload-artifact@v7
        with:
          name: python-wheel
          path: dist/*.whl
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pyopendrive/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-wheel
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Create GitHub release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
