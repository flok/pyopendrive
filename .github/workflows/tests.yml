name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Check lint and formatting
        run: uv run --locked ruff check . && uv run --locked ruff format --check .

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: uv run --locked python tests/fetch_testdata.py && uv run --locked pytest
      - name: Build distributions
        run: uv build
      - name: Verify installed wheel
        run: uv run --isolated --no-project --with dist/*.whl python tests/check_distribution.py
      - name: Verify installed source distribution
        run: uv run --isolated --no-project --with dist/*.tar.gz python tests/check_distribution.py
